# 默认解析，即识别最高优先级，修改后重启生效
videoTool: true

# 自定义优先级，「默认解析」关闭后才会生效。修改后重启生效
priority: 800

# 缓存删除，非必要不修改！
removeCache: true

# 可复用共享缓存保留时长，单位小时
sharedCacheTtlHours: 24

# 渲染精度，可选值50~200，建议100。设置高精度会提高图片的精细度，过高可能会影响渲染与发送速度
renderScale: 100

# 渲染评论图和推送图的主题色，0为自动（06:00-18:00为浅色，18:00-06:00为深色），1为浅色，2为深色
Theme: 0

# 渲染的图片是否移除底部版本信息
RemoveWatermark: false

# 渲染图片的等待时间，单位：秒。传递 0 可禁用等待（Linux系统必须大于0）
RenderWaitTime: 60

# 表情回应，若适配器或对应平台不支持需要关闭
EmojiReply: true

# 解析提示，发送提示信息："检测到xxx链接，开始解析"
parseTip: false

# 是否伪造合并转发消息，开启后使用触发者身份展示转发
fakeForward: false

# 是否启用插件自动更新。关闭后，定时检查、提醒回复触发和手动 `#kkk更新` 都不会生效
autoUpdate: false

# 检测到磁盘上已安装比当前运行版本更高的新版本后，自动重启插件进程使其生效
autoRestartOnInstalledUpdate: false

# 长任务完成提醒。解析、总结、详细总结、转写任务耗时达到阈值后，会回复结果消息提醒触发者
longTaskCompletionNotify: true

# 长任务提醒阈值，单位毫秒
longTaskCompletionNotifyThresholdMs: 300000

# 遇到错误时谁会收到错误日志？可选值：'master'（除'console'外的第一个主人）、'allMasters'（所有主人，排除console）、'trigger'（触发者）
errorLogSendTo: 
  - master

# 智能分页渲染，将超长渲染图按安全位置拆成多页图片
multiPageRender: true

# 渲染图高宽比超过该值时触发智能分页
multiPageTriggerAspectRatio: 3

# 智能分页后，单页允许的最大高宽比
multiPageMaxAspectRatio: 2.2

# 渲染图输出格式。auto 表示按模板使用内置推荐；jpeg 体积更小；png 更清晰但更大
renderImageFormat: auto

# JPEG 渲染质量，1-100；auto/手动 JPEG 输出时生效
renderImageQuality: 95

# 当解析到作品/动态包含 Live Photo 时，合并转发消息里发送的 Live Photo 静态图兼容系统
# 可选值：
#   'google' - Google Motion Photo 格式
#   'xiaomi' - 小米实况照片格式，兼容小米（支持实况照片的任何版本）和 Google，但无法被 OPPO 识别
#   'oppo' - OPPO 实况照片格式（推荐），兼容 OPPO、小米（较新版本）和 Google，兼容性最广
#   'huawei_honor' - 华为/荣耀实况照片格式（理论可行但未实测，作者无对应设备）
# 注：vivo（Origin OS）和 iPhone（iOS）需要独立的图片和同名视频文件，暂不支持
livePhotoSystem: oppo

# 解析遇到实况图时的处理和发送方式
# 可选值：'video_and_livephoto'（生成并发送仿 iPhone Live Photo 播放效果的视频（播放三次，性能开销大，2C2G 服务器约 20s/张）+ 对应系统的实况图）、'video_only'（仅生成并发送仿 iPhone Live Photo 播放效果的视频（播放三次，性能开销大，2C2G 服务器约 20s/张））、'livephoto_only'（仅生成并发送对应系统的实况图）
livePhotoMode: video_and_livephoto

# 扫码登录时使用的地址类型，可选值：'lan'（局域网IP）、'external'（外部地址）
qrLoginAddrType: lan

# 外部访问地址（当 qrLoginAddrType 为 'external' 时使用，可以是公网IP或域名）
qrLoginExternalAddr: ''

# 解析总结配置
summaryParse:
  # 是否启用解析总结模式
  switch: false

  # 触发解析总结的关键词列表（使用方式：#关键词 待解析内容）
  keywords:
    - 总结
    - 解析总结

  # 生成总结后，是否继续发送原始解析内容
  sendParsedContent: false

  # OpenAI Responses LLM 配置
  llm:
    baseUrl: 'https://api.openai.com/v1'
    apiKey: ''
    model: 'gpt-4o-mini'
    timeoutMs: 60000
    retryCount: 1
    retryDelayMs: 1500
    webSearchEnabled: false
    reasoningEnabled: true
    reasoningEffort: 'high'

  # 视频转写配置
  asr:
    mode: 'cloud'
    whisperCppPath: 'whisper-cli'
    modelPath: ''
    language: 'zh'
    threads: 4
    ffmpegPath: 'ffmpeg'
    audioBitrateKbps: 24
    maxSegmentMinutes: 30
    videoFrames:
      enabled: false
      minIntervalSeconds: 30
      maxImages: 6
      skipStartSeconds: 3
      skipEndSeconds: 3
      sourceMode: 'auto'
    cloud:
      baseUrl: 'https://api.siliconflow.cn/v1'
      apiKey: ''
      model: 'FunAudioLLM/SenseVoiceSmall'
      timeoutMs: 45000
      retryCount: 1
      retryDelayMs: 1500

# 详细解析总结配置
detailedSummaryParse:
  # 是否启用详细解析总结模式
  switch: false

  # 触发详细解析总结的关键词列表（使用方式：#关键词 待解析内容）
  keywords:
    - 详细总结
    - 深度总结

  # 生成详细研报后，是否继续发送原始解析内容
  sendParsedContent: false

  # 是否优先发送 Markdown 消息段，让运行端 Markdown 插件渲染为截图
  markdownRender:
    enabled: false
    sendTextVersion: false
    fontSizePx: 16
    multiPageEnabled: true
    multiPageTriggerAspectRatio: 3
    multiPageMaxAspectRatio: 2.2

  # OpenAI Responses LLM 配置
  llm:
    baseUrl: 'https://api.openai.com/v1'
    apiKey: ''
    model: 'gpt-5-mini'
    timeoutMs: 90000
    retryCount: 1
    retryDelayMs: 1500
    webSearchEnabled: true
    reasoningEnabled: true
    reasoningEffort: 'high'

  # 视频转写配置
  asr:
    mode: 'cloud'
    whisperCppPath: 'whisper-cli'
    modelPath: ''
    language: 'zh'
    threads: 4
    ffmpegPath: 'ffmpeg'
    audioBitrateKbps: 24
    maxSegmentMinutes: 30
    videoFrames:
      enabled: false
      minIntervalSeconds: 30
      maxImages: 6
      skipStartSeconds: 3
      skipEndSeconds: 3
      sourceMode: 'auto'
    cloud:
      baseUrl: 'https://api.openai.com/v1'
      apiKey: ''
      model: 'gpt-4o-mini-transcribe'
      timeoutMs: 45000
      retryCount: 1
      retryDelayMs: 1500

# 转写原文配置
transcriptOriginal:
  # 是否启用转写原文模式
  switch: false

  # 触发转写原文的关键词列表（使用方式：#关键词 待解析内容）
  keywords:
    - 转写原文
    - 原文

  # 生成转写原文后，是否继续发送原始解析内容
  sendParsedContent: false

  # 是否优先发送 Markdown 消息段，让运行端 Markdown 插件渲染为截图
  markdownRender:
    enabled: false
    sendTextVersion: false
    fontSizePx: 16
    multiPageEnabled: true
