  # 视频转写配置
  asr:
    mode: 'cloud'
    whisperCppPath: 'whisper-cli'
    modelPath: ''
    language: 'zh'
    threads: 4
    ffmpegPath: 'ffmpeg'
    audioBitrateKbps: 24
