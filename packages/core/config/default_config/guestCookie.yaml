  testUrl: 'http://xhslink.cn/o/1wPOQ9a9RyI'
  # 判断小红书 Cookie 是否完整时必须包含的 Cookie 名
  requiredCookies:
    - a1
    - webId
    - web_session

# TikTok 游客 Cookie 获取配置
tiktok:
